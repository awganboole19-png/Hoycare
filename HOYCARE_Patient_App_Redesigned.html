<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#063b86"><title>HOYCARE | Patient App</title><style>
:root{--blue:#07377f;--deep:#07143c;--teal:#00ad99;--muted:#66758e;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:#e8eef5;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--deep)}button,input,textarea,select{font:inherit}button{cursor:pointer}#app{max-width:480px;min-height:100dvh;margin:auto;background:white;position:relative;box-shadow:0 0 35px #17376b18}.screen{padding-bottom:86px;min-height:100dvh}.hidden{display:none!important}.hero{background:linear-gradient(125deg,#063579 12%,#004c89 56%,#00a995 125%);color:white;padding:25px 22px 36px;border-radius:0 0 32px 32px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:220px;height:100px;right:-60px;bottom:-66px;background:#04b5a4;transform:rotate(-14deg);border-radius:50%}.logo{display:flex;align-items:center;gap:10px}.mark{width:54px;height:54px;border-radius:13px;background:linear-gradient(145deg,#f6ffff,#b9fff0);color:#06417f;display:grid;place-items:center;font-size:38px;font-weight:1000;font-style:italic;line-height:1}.logo strong{font-size:26px;letter-spacing:-1.2px}.logo small{display:block;font-size:11px;color:#25ddc2;font-weight:800;letter-spacing:.4px}.slogan{text-align:center;font-size:12px;font-weight:600;font-style:italic;margin-top:9px}.main{padding:0 19px}.welcome-card{position:relative;background:white;border-radius:26px;margin-top:-18px;padding:22px 18px;box-shadow:0 7px 22px #0a39751b}.userrow{display:flex;align-items:center;gap:13px}.avatar{background:#c7f4ef;color:#078f96;width:53px;height:53px;display:grid;place-items:center;border-radius:50%;font-size:29px}.userrow h2{margin:0;font-size:22px}.userrow p{margin:3px 0;color:#42536f;font-size:13px}.search{margin-top:17px;border:1px solid #d9e0e9;background:#f5f7fa;border-radius:17px;padding:13px;width:100%;outline:none}.services{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin:17px 0 22px}.service{border:0;border-radius:18px;min-height:137px;padding:14px 5px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#0a1940;position:relative}.service .symbol{font-size:37px;line-height:1.15}.service b{font-size:13px;line-height:1.2}.service small{font-size:11px}.service:nth-child(1){background:#d2f4ee}.service:nth-child(2){background:#fff0c9}.service:nth-child(3){background:#e9e5ff}.service:nth-child(4){background:#ffe2e9}.service:nth-child(5),.service:nth-child(6){background:#e9ebef}.soon{position:absolute;top:8px;right:6px;background:#ff891e;color:white;border-radius:12px;padding:4px 6px;font-size:10px;font-weight:800}.call{background:linear-gradient(110deg,#007d9a,#073d88 45%,#00b796);border:0;border-radius:20px;padding:15px 17px;color:white;width:100%;display:flex;align-items:center;gap:13px;text-align:left}.call .circle{background:#00b7a4;border-radius:50%;height:49px;width:49px;display:grid;place-items:center;font-size:27px}.call b{font-size:17px}.call strong{font-size:35px;line-height:1}.section-title{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.section-title h3{margin:0;font-size:20px}.link{border:0;background:none;color:var(--blue);font-weight:700}.booking-card{border:1px solid #e2e6ec;border-radius:18px;padding:15px;display:flex;gap:13px;align-items:center;margin:10px 0;background:#fff}.booking-card .symbol{background:#d7f5f1;padding:11px;border-radius:12px;font-size:24px}.booking-card .detail{flex:1;min-width:0}.booking-card b{display:block;font-size:15px}.booking-card small{display:block;color:#5c6c82;margin-top:4px}.status{font-size:11px;font-weight:750;padding:8px;border-radius:30px;background:#fff2ce;color:#8e6300}.status.confirmed{background:#c8f5d9;color:#12633d}.status.cancelled{background:#ffe0e0;color:#8d2525}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;height:75px;background:white;border-top:1px solid #e6e9ee;display:flex;justify-content:space-around;z-index:5;padding-bottom:env(safe-area-inset-bottom)}.nav button{background:none;border:0;color:#708097;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;min-width:70px}.nav button span{font-size:25px}.nav button.active{color:#007f9b;font-weight:800}.topbar{background:linear-gradient(115deg,#009f9c,#05377f);color:white;padding:25px 20px 31px;border-radius:0 0 27px 27px;display:flex;align-items:center;gap:15px}.topbar button{background:none;color:white;border:0;font-size:27px}.topbar h2{font-size:23px;margin:0}.panel{padding:20px}.selected-service{display:flex;align-items:center;gap:15px;padding-bottom:20px;border-bottom:1px solid #e7e9ee}.selected-service .symbol{font-size:52px;background:#d9f4f0;border-radius:20px;padding:13px}.selected-service h3{font-size:20px;margin:0 0 5px}.selected-service p{margin:0;color:#3c4a63;font-size:13px;line-height:1.5}.form-section{margin:23px 0}.form-section h3{font-size:18px;margin:0 0 14px}.dates,.times{display:grid;gap:9px}.dates{grid-template-columns:repeat(4,1fr)}.times{grid-template-columns:repeat(3,1fr)}.choice{border:1px solid #dfe4ed;background:white;border-radius:13px;padding:13px 3px;color:#142243;font-size:13px}.choice.selected{background:linear-gradient(130deg,#00b49e,#047fa6);color:white;border-color:transparent}.field{margin:13px 0}.field label{display:block;font-weight:650;font-size:13px;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid #dce1e9;background:#f7f8fa;border-radius:12px;padding:13px 14px;outline:none;color:#122140}.primary{background:linear-gradient(105deg,#00aa97,#00518c);color:white;border:0;border-radius:24px;padding:16px;width:100%;font-weight:800;font-size:16px;margin-top:13px}.secondary{border:1px solid #b7d9dd;background:white;color:#007c8f;border-radius:13px;padding:10px 14px;font-weight:700}.empty{text-align:center;padding:42px 20px;color:#718099}.empty .symbol{font-size:45px}.smallnote{font-size:12px;color:#748198;line-height:1.5}.profile-box{border-radius:18px;background:#f2f7fa;padding:18px}.profile-box h3{margin:0 0 10px}.profile-box p{margin:7px 0;color:#485a75}.onboard{min-height:100dvh;display:flex;flex-direction:column;background:white;padding:50px 26px 25px;justify-content:space-between}.onboard .logo{justify-content:center}.onboard .logo strong{font-size:30px}.onboard .slogan{color:#06427d}.nurse{margin:28px auto 0;max-width:290px;width:100%;height:260px;display:flex;align-items:center;justify-content:center;border-radius:50% 50% 30% 30%;background:linear-gradient(145deg,#c5f5ed,#eaf9fb 55%,#0a3e86);font-size:140px}.onboard h1{text-align:center;font-size:34px;line-height:1.13;margin:16px 0 8px}.onboard p{text-align:center;color:#34405b;line-height:1.5}.onboard .primary{margin-top:20px}.notice{background:#e9f9f6;padding:12px;border-radius:12px;color:#087f79;font-size:12px;margin:12px 0}.pill{background:#e7f8f5;color:#087b7b;border-radius:25px;padding:5px 9px;font-size:11px}.message{background:#f2f7fb;padding:15px;border-radius:14px;margin-bottom:12px;line-height:1.5}.message small{color:#728096}.hidden-search{display:none!important}@media(max-width:360px){.service{min-height:118px}.service .symbol{font-size:30px}.service b{font-size:11px}.dates{gap:5px}.choice{font-size:11px}}
</style></head><body><div id="app"></div><script>
const services=[{id:'nursing',name:'Home Nursing',icon:'⌂',emoji:'🏠',desc:'Professional nursing care at your home (wound care, injections, medication, and more).',available:true},{id:'caregiver',name:'Caregiver Support',icon:'♧',emoji:'🫂',desc:'Compassionate support and assistance at home.',available:true},{id:'lab',name:'Laboratory',sub:'(Home Sample)',icon:'⚗',emoji:'🧪',desc:'Convenient laboratory sample collection from your home.',available:true},{id:'pharmacy',name:'Pharmacy',sub:'(Home Delivery)',icon:'💊',emoji:'💊',desc:'Request pharmacy home delivery.',available:true},{id:'physio',name:'Physiotherapy',icon:'♿',emoji:'🧑‍🦽',desc:'Physiotherapy services.',available:false},{id:'doctor',name:'Doctor Home Visit',icon:'⚕',emoji:'🩺',desc:'Professional doctor visits at home.',available:false}];
const store='hoycare_patient_redesign_v1';let state=JSON.parse(localStorage.getItem(store)||'{}');state.bookings=state.bookings||[];state.name=state.name||'';state.phone=state.phone||'';let page=state.started?'home':'onboard',current='nursing',chosenDate='',chosenTime='',filter='';function save(){localStorage.setItem(store,JSON.stringify(state))}const $=()=>document.getElementById('app');function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function logo(){return `<div class="logo"><div class="mark">H</div><div><strong>HOYCARE</strong><small>HEALTHCARE GROUP</small></div></div>`}function nav(){return `<div class="nav">${[['home','⌂','Home'],['bookings','▦','Bookings'],['messages','☏','Messages'],['profile','♙','Profile']].map(([id,icon,name])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span>${icon}</span>${name}</button>`).join('')}</div>`}function header(title){return `<header class="topbar"><button onclick="go('home')" aria-label="Back">‹</button><h2>${title}</h2></header>`}function go(p){page=p;render();window.scrollTo(0,0)}function start(){state.started=true;save();go('home')}function choose(id){const s=services.find(x=>x.id===id);if(!s.available){alert(s.name+' is coming soon. This service is not available for booking yet.');return}current=id;chosenDate='';chosenTime='';go('book')}function dates(){return Array.from({length:8},(_,i)=>{let d=new Date();d.setDate(d.getDate()+i);return {key:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),day:d.toLocaleDateString('en',{weekday:'short'}),label:d.toLocaleDateString('en',{day:'numeric',month:'short'})}})}function render(){let html='';if(page==='onboard'){html=`<section class="onboard"> <div>${logo()}<div class="slogan">— Daryeel Kuu Dhow, Kalsooni Kuu Dhisan. —</div><div class="nurse">👩🏽‍⚕️</div><h1>Healthcare at<br>Your Home</h1><p>Book professional healthcare services at home, anytime.</p></div><div><button class="primary" onclick="start()">Get Started →</button><p class="smallnote">HOYCARE Patient App • Prototype</p></div></section>`}else if(page==='home'){const shown=services.filter(s=>(s.name+' '+(s.sub||'')).toLowerCase().includes(filter.toLowerCase()));html=`<div class="screen"><div class="hero">${logo()}<div class="slogan">— Daryeel Kuu Dhow, Kalsooni Kuu Dhisan. —</div></div><main class="main"><div class="welcome-card"><div class="userrow"><div class="avatar">♟</div><div><h2>Hi, ${safe(state.name.split(' ')[0]||'Welcome')}!</h2><p>📍 Borama, Somaliland</p></div><button class="link" onclick="go('profile')">⌄</button></div><input class="search" id="search" placeholder="⌕  Search services..." value="${safe(filter)}" oninput="filter=this.value;renderServices()"><div class="services" id="services">${shown.map(serviceCard).join('')}</div><button class="call" onclick="location.href='tel:3117'"><span class="circle">☎</span><span><b>Call HOYCARE</b><br><strong>3117</strong></span><span style="margin-left:auto;font-size:32px">☎</span></button><div class="section-title"><h3>Your Bookings</h3><button class="link" onclick="go('bookings')">See All</button></div>${state.bookings.length?state.bookings.slice(0,2).map(bookingCard).join(''):'<div class="smallnote">No bookings yet. Choose a service above to get started.</div>'}</div></main>${nav()}</div>`}else if(page==='book'){let s=services.find(x=>x.id===current);html=`<div class="screen">${header('Book Service')}<div class="panel"><div class="selected-service"><span class="symbol">${s.emoji}</span><div><h3>${s.name}</h3><p>${s.desc}</p></div></div><div class="form-section"><h3>▦ Select Date & Time</h3><div class="dates">${dates().map(d=>`<button class="choice ${chosenDate===d.key?'selected':''}" onclick="chosenDate='${d.key}';render()">${d.day}<br><b>${d.label}</b></button>`).join('')}</div><div class="times" style="margin-top:13px">${['09:00 AM','10:00 AM','12:00 PM','02:00 PM','04:00 PM','06:00 PM'].map(t=>`<button class="choice ${chosenTime===t?'selected':''}" onclick="chosenTime='${t}';render()">${t}</button>`).join('')}</div></div><div class="form-section"><h3>♟ Patient Details</h3><form id="bookingform" onsubmit="submitBooking(event)"><div class="field"><label>Patient Name *</label><input id="patientName" required value="${safe(state.name)}" placeholder="Enter full name"></div><div class="field"><label>Phone Number *</label><input id="patientPhone" required type="tel" value="${safe(state.phone)}" placeholder="Your phone number"></div><div class="field"><label>Home Address *</label><input id="patientAddress" required value="${safe(state.address||'')}" placeholder="Neighborhood, street or landmark"></div><div class="field"><label>Additional Notes (optional)</label><textarea id="patientNotes" rows="2" placeholder="Tell us what you need"></textarea></div><button class="primary" type="submit">Confirm Booking</button></form><p class="smallnote">Demo: your booking is saved on this device only. It is not yet sent to HOYCARE management.</p></div></div>${nav()}</div>`}else if(page==='bookings'){html=`<div class="screen">${header('My Bookings')}<div class="panel"><div class="notice">Booking requests are stored on this device until the online system is connected.</div>${state.bookings.length?state.bookings.map(bookingCard).join(''):'<div class="empty"><div class="symbol">▦</div><h3>No bookings yet</h3><p>Choose a service to make your first booking.</p><button class="primary" onclick="go(\'home\')">Browse Services</button></div>'}</div>${nav()}</div>`}else if(page==='messages'){html=`<div class="screen">${header('Messages')}<div class="panel"><div class="message"><b>Welcome to HOYCARE!</b><p>For assistance with your home healthcare services, call us at <b>3117</b>.</p><small>HOYCARE Healthcare Group</small></div><div class="notice">In-app messaging will be enabled when the online backend is connected.</div><button class="primary" onclick="location.href='tel:3117'">☎ Call 3117</button></div>${nav()}</div>`}else if(page==='profile'){html=`<div class="screen">${header('My Profile')}<div class="panel"><div class="profile-box"><h3>Personal Information</h3><p>Manage the details used for your bookings.</p></div><form onsubmit="saveProfile(event)"><div class="field"><label>Full Name</label><input id="profileName" value="${safe(state.name)}" required></div><div class="field"><label>Phone Number</label><input id="profilePhone" type="tel" value="${safe(state.phone)}" required></div><div class="field"><label>Home Address</label><input id="profileAddress" value="${safe(state.address||'')}"></div><button class="primary">Save Profile</button></form><div class="notice">HOYCARE Healthcare Group<br>Daryeel Kuu Dhow, Kalsooni Kuu Dhisan.</div></div>${nav()}</div>`} $('app').innerHTML=html}function serviceCard(s){return `<button class="service" onclick="choose('${s.id}')">${!s.available?'<span class="soon">Soon</span>':''}<span class="symbol">${s.emoji}</span><b>${s.name}</b>${s.sub?`<small>${s.sub}</small>`:''}</button>`}function renderServices(){const el=document.getElementById('services');if(el)el.innerHTML=services.filter(s=>(s.name+' '+(s.sub||'')).toLowerCase().includes(filter.toLowerCase())).map(serviceCard).join('')||'<p>No services found.</p>'}function bookingCard(b){const s=services.find(x=>x.id===b.service)||services[0];return `<div class="booking-card"><span class="symbol">${s.emoji}</span><div class="detail"><b>${safe(s.name)}</b><small>${safe(b.date)} • ${safe(b.time)}</small><small>${safe(b.address)}</small></div><span class="status">Pending</span></div>`}function submitBooking(e){e.preventDefault();if(!chosenDate||!chosenTime){alert('Please select a date and time.');return}let name=document.getElementById('patientName').value.trim(),phone=document.getElementById('patientPhone').value.trim(),address=document.getElementById('patientAddress').value.trim();if(!name||!phone||!address)return;state.name=name;state.phone=phone;state.address=address;state.bookings.unshift({id:Date.now(),service:current,date:chosenDate,time:chosenTime,name,phone,address,notes:document.getElementById('patientNotes').value,status:'Pending'});save();alert('Booking request saved on this device (demo). It has not been sent to HOYCARE management yet.');go('bookings')}function saveProfile(e){e.preventDefault();state.name=document.getElementById('profileName').value.trim();state.phone=document.getElementById('profilePhone').value.trim();state.address=document.getElementById('profileAddress').value.trim();save();alert('Profile saved on this device.');go('home')}render();
</script></body></html>
