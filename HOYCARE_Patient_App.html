<!doctype html><html lang="so"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOYCARE | Patient App</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#163247;background:#f3f7fa}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#087e8b;color:white}button.secondary{background:#e8f3f4;color:#086977}button.danger{background:#fff0ee;color:#b33d35}.app{display:flex;min-height:100vh}aside{width:245px;background:#063b50;color:#fff;padding:24px 15px;position:sticky;top:0;height:100vh}.brand{font-size:24px;font-weight:850;letter-spacing:1px;margin:0 10px 5px}.sub{font-size:12px;color:#b9dce2;margin:0 10px 28px}.nav{display:block;width:100%;text-align:left;background:transparent;color:#d5e9ed;padding:12px;margin:4px 0}.nav.active,.nav:hover{background:#116479;color:#fff}.main{flex:1;min-width:0;padding:28px;max-width:1400px}header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:23px}h1{font-size:26px;margin:0}h2{font-size:19px;margin:0 0 16px}p.muted,.muted{color:#69828d}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.card,.panel{background:white;border:1px solid #e0e9ed;border-radius:16px;padding:20px;box-shadow:0 3px 14px #15384908}.card .num{font-size:28px;font-weight:800;margin-top:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{margin-bottom:18px;overflow-x:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px;flex-wrap:wrap}.badge{display:inline-block;font-size:12px;border-radius:30px;padding:5px 9px;background:#e9f1f4;color:#45616c}.badge.ok{background:#ddf6e9;color:#126d47}.badge.wait{background:#fff3d6;color:#90620b}table{width:100%;border-collapse:collapse;min-width:620px}td,th{text-align:left;padding:12px;border-bottom:1px solid #e9eef0;font-size:13px}th{color:#607a86;font-weight:650}input,select{padding:10px 11px;border:1px solid #d2e1e6;border-radius:9px;background:#fff;width:100%;color:#193c49}label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 14px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{font-size:12px;padding:7px 10px}.hide{display:none!important}.service{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e9eef0;padding:14px 0;gap:12px}.service:last-child{border:0}.service strong{display:block}.service small{color:#6c8790}.service input[type=checkbox]{width:18px;height:18px;accent-color:#087e8b}.hint{font-size:12px;color:#647f89}.topright{display:flex;align-items:center;gap:12px}.call{font-weight:800;color:#087e8b;font-size:20px}.toast{position:fixed;bottom:20px;right:20px;background:#063b50;color:white;border-radius:10px;padding:13px 18px;display:none;max-width:350px;z-index:10}.login{max-width:430px;margin:8vh auto;padding:28px;background:white;border-radius:18px;box-shadow:0 12px 40px #14394a18}.login h1{color:#087e8b}.small{font-size:12px}.note{background:#eaf7f8;border:1px solid #c8e8ea;padding:12px;border-radius:10px;margin-bottom:16px}.stat{color:#607c88;font-size:13px}.money{font-weight:800;color:#087e8b}.empty{padding:20px;text-align:center;color:#758d98}@media(max-width:950px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}aside{width:195px}}@media(max-width:650px){.app{display:block}aside{width:100%;height:auto;position:static;padding:13px}.brand{display:inline}.sub{display:inline;margin-left:8px}.menu{display:flex;overflow:auto;gap:4px;margin-top:10px}.nav{width:auto;white-space:nowrap;margin:0}.main{padding:16px}.cards{gap:9px}.card{padding:13px}.card .num{font-size:22px}.formgrid{grid-template-columns:1fr}header{align-items:flex-start}.call{font-size:17px}}
/* HOYCARE brand-inspired palette: deep navy, medical teal and clean white */
:root{--hc-navy:#073B50;--hc-teal:#00A6A6;--hc-teal-dark:#087E8B;--hc-ice:#EAF8F8;--hc-white:#FFFFFF;color:#12394A;background:#F2FAFA}
body{background:#F2FAFA}aside{background:linear-gradient(180deg,#073B50 0%,#075B68 100%)}
.nav.active,.nav:hover{background:#087E8B}button{background:#008F98}button:hover{filter:brightness(.95)}button.secondary{background:#DDF4F3;color:#075B68}
.card,.panel{border-color:#D5EAEA;box-shadow:0 4px 18px #073B500B}.card .num{color:#075B68}
.brand{color:#FFFFFF}.sub{color:#D3F0F0}h1,h2{color:#073B50}aside .brand,aside .sub{color:#FFFFFF}
.call{background:#DDF4F3!important;color:#075B68!important;border-color:#B8E4E2!important}
input:focus,select:focus{outline:2px solid #00A6A6;outline-offset:1px}
::selection{background:#B8E4E2;color:#073B50}
 .patient-portal{max-width:650px;margin:35px auto;padding:24px;background:white;border-radius:20px;box-shadow:0 8px 32px #073b5017}.patient-portal h1{color:#075b68}.patient-portal label{display:block;margin-top:14px}.patient-portal input,.patient-portal select{width:100%}.patient-portal .hero{background:#e2f6f5;padding:18px;border-radius:14px;margin:18px 0}.patient-portal .hero a{color:#075b68;font-weight:800}.patient-portal button{margin-top:18px}.portal-actions{display:flex;gap:8px;flex-wrap:wrap}.portal-actions button{flex:1} </style></head><body><div class="patient-portal" id="patientPortal"><h1>✚ HOYCARE</h1><p class="muted">Home Healthcare · Patient Booking</p><div class="hero"><strong>Caawimaad degdeg ah ama booking telefoon?</strong><p>☎ <a href="tel:3117">Call HOYCARE 3117</a></p></div><div class="note small">Tijaabo keliya: ha gelin xog caafimaad oo dhab ah. Codsigaaga wuxuu u gudbayaa dashboard-ka demo-ga ee isla browser-kan.</div><form id="patientForm"><label>Magaca bukaanka</label><input maxlength="80" name="patient" placeholder="Magacaaga" required=""/><label>Telefoon</label><input maxlength="25" name="phone" placeholder="Lambarkaaga" required=""/><label>Adeegga aad rabto</label><select id="patientService" name="serviceId" required=""></select><label>Taariikhda iyo waqtiga</label><input name="date" required="" type="datetime-local"/><label>Goobta / xaafadda (ikhtiyaari)</label><input maxlength="120" name="location" placeholder="Xaafadda"/><div class="portal-actions"><button type="submit">Dir Booking</button><button class="secondary" onclick="window.location.href='tel:3117'" type="button">☎ Wac 3117</button></div></form><div class="hint" id="patientResult" role="status"></div></div><div id="toast" class="toast"></div><script>const KEY='hoycare_demo_v2';const defaults={services:[{id:1,name:'Home Nursing',price:20,active:true},{id:2,name:'Caregiver',price:25,active:true},{id:3,name:'Laboratory',price:15,active:true},{id:4,name:'Pharmacy',price:10,active:true},{id:5,name:'Physiotherapy',price:30,active:false},{id:6,name:'Doctor Home Visit',price:35,active:false}],bookings:[]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch(e){db=structuredClone(defaults)}const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'$'+Number(n||0).toFixed(2);function save(){localStorage.setItem(KEY,JSON.stringify(db))}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3000)}function openPatient(){$('patientService').innerHTML=db.services.filter(s=>s.active).map(s=>`<option value="${s.id}">${esc(s.name)} · ${money(s.price)}</option>`).join('');$('patientResult').textContent=''}document.getElementById('patientForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),service=db.services.find(s=>s.id===Number(f.get('serviceId')));if(!service?.active)return toast('Adeeggan hadda lama heli karo');const date=String(f.get('date'));if(new Date(date).getTime()<Date.now())return toast('Dooro waqti mustaqbalka ah');const id=Date.now();db.bookings.push({id,patient:String(f.get('patient')).trim(),phone:String(f.get('phone')).trim(),location:String(f.get('location')).trim(),serviceId:service.id,staffId:null,date,price:service.price,percent:null,status:'Pending',source:'Patient Portal'});save();e.target.reset();$('patientResult').textContent='Codsiga tijaabada ah waa la diray! Booking #'+id+' · Status: Pending.'};openPatient();</script></body></html>
